<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaosphere | Live Leaderboard</title>
    <meta name="description" content="Live Chaosphere AluMoney economy leaderboard — real-time team rankings and balances.">
    <link rel="icon" type="image/png" href="../assets/ChoasphereLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/leaderboard.css">
    <script>
        (function () {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('chaosphere-theme', 'dark');
        })();
    </script>
</head>

<body class="leaderboard-page">
    <div class="page-loader" aria-live="polite" aria-busy="true">
        <div class="page-loader__core">
            <div class="page-loader__ring"></div>
            <div class="page-loader__spark"></div>
            <p>Loading Chaosphere</p>
        </div>
    </div>

    <canvas id="antigravity-canvas" class="antigravity-canvas"></canvas>

    <header class="corner-logos" aria-label="Branding">
        <img class="corner-logo logo-left" src="../assets/B2BLogo.png" alt="B2B Logo">
        <img class="corner-logo logo-right" src="../assets/ChoasphereLogo.png" alt="Chaosphere Logo">
    </header>

    <main class="leaderboard-shell" aria-labelledby="leaderboard-title">
        <section class="leaderboard-card">
            <div class="leaderboard-card__glow" aria-hidden="true"></div>
            <div class="leaderboard-card__shimmer" aria-hidden="true"></div>
            <div class="leaderboard-card__content">

                <!-- Header -->
                <div class="leaderboard-heading">
                    <div>
                        <p class="leaderboard-kicker">
                            <span class="kicker-icon" aria-hidden="true">◆</span>
                            Live Economy Dashboard
                        </p>
                        <h1 id="leaderboard-title">Chaosphere Leaderboard</h1>
                        <p class="leaderboard-subtitle">Real-time AluMoney standings</p>
                    </div>
                    <div class="leaderboard-meta">
                        <span class="leaderboard-status" id="leaderboard-status">
                            <span class="status-dot" aria-hidden="true"></span>
                            <span class="status-text">Fetching latest data...</span>
                        </span>
                        <span class="leaderboard-updated" id="leaderboard-updated">--</span>
                    </div>
                </div>

                <!-- Economy Stats Bar -->
                <div class="economy-bar" id="economy-bar" aria-label="Economy statistics">
                    <div class="economy-stat">
                        <span class="economy-stat__label">Total Economy</span>
                        <span class="economy-stat__value" id="stat-total-economy">--</span>
                    </div>
                    <div class="economy-stat">
                        <span class="economy-stat__label">Teams</span>
                        <span class="economy-stat__value" id="stat-team-count">--</span>
                    </div>
                    <div class="economy-stat">
                        <span class="economy-stat__label">Avg Balance</span>
                        <span class="economy-stat__value" id="stat-avg-balance">--</span>
                    </div>
                    <div class="economy-stat">
                        <span class="economy-stat__label">Top Balance</span>
                        <span class="economy-stat__value" id="stat-top-balance">--</span>
                    </div>
                </div>

                <!-- Leaderboard Table -->
                <div class="leaderboard-grid" role="table" aria-label="Leaderboard table">
                    <div class="leaderboard-row leaderboard-row--header" role="row">
                        <div class="leaderboard-cell cell-rank" role="columnheader">Rank</div>
                        <div class="leaderboard-cell cell-team" role="columnheader">Team</div>
                        <div class="leaderboard-cell cell-movement" role="columnheader">Move</div>
                        <div class="leaderboard-cell cell-balance" role="columnheader">Balance (₳)</div>
                    </div>
                    <div id="leaderboard-list" class="leaderboard-list" role="rowgroup"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/leaderbaord.js"></script>
</body>

</html>
